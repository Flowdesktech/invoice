name: Deploy Firebase Backend

# Frontend (Next.js) is deployed separately by Vercel's Git integration.
# This workflow only deploys the Firebase-managed backend: Cloud Functions,
# Firestore rules, and Storage rules.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        # Pin to a recent version that supports firebase-functions v6
        # (the `extensions` key in the build spec). --force overrides any
        # firebase-tools that may be pre-installed on the runner.
        run: npm install -g --force firebase-tools@14

      - name: Verify Firebase CLI version
        run: firebase --version

      - name: Setup Firebase Authentication
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/service-account.json" >> $GITHUB_ENV
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/service-account.json','utf-8'))" \
            && echo "Service account JSON is valid."

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} --non-interactive --force
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_FROM_EMAIL: ${{ secrets.MAILGUN_FROM_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules,firestore:indexes,storage --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} --non-interactive

      - name: Clean up service account
        if: always()
        run: rm -f $HOME/service-account.json

      - name: Create deployment summary
        if: success()
        run: |
          echo "# Firebase Backend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Components Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Firebase Cloud Functions" >> $GITHUB_STEP_SUMMARY
          echo "- Firestore rules + indexes" >> $GITHUB_STEP_SUMMARY
          echo "- Storage rules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend is deployed by Vercel via its Git integration." >> $GITHUB_STEP_SUMMARY
