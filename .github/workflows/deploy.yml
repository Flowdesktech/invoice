name: Deploy to Firebase

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
      env:
        CI: true
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    
    - name: Install Firebase Functions dependencies
      run: |
        cd functions
        npm ci
        cd ..

    - name: Install Firebase CLI
      # Pin to a recent version that supports firebase-functions v6 (the
      # `extensions` key in the build spec). Using --force to override any
      # firebase-tools that may be pre-installed on the runner.
      run: npm install -g --force firebase-tools@14

    - name: Verify Firebase CLI version
      run: firebase --version

    - name: Setup Firebase Authentication
      run: |
        printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/service-account.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/service-account.json" >> $GITHUB_ENV
        # Sanity check: file must be valid JSON and non-empty
        node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/service-account.json','utf-8'))" \
          && echo "Service account JSON is valid."

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        channelId: live
        projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

    - name: Deploy Firebase Functions
      run: firebase deploy --only functions --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} --non-interactive --force
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
        MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
        MAILGUN_FROM_EMAIL: ${{ secrets.MAILGUN_FROM_EMAIL }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Deploy Firestore Rules
      run: firebase deploy --only firestore:rules --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }} --non-interactive

    - name: Clean up service account
      if: always()
      run: |
        rm -f $HOME/service-account.json
    
    - name: Create deployment summary
      if: success()
      run: |
        echo "# Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Deployed Components" >> $GITHUB_STEP_SUMMARY
        echo "✅ Firebase Hosting" >> $GITHUB_STEP_SUMMARY
        echo "✅ Firebase Functions" >> $GITHUB_STEP_SUMMARY
        echo "✅ Firestore Rules" >> $GITHUB_STEP_SUMMARY
        echo "✅ Storage Rules" >> $GITHUB_STEP_SUMMARY
